# Code authors: Vijay Erramilli and Codex
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.5"
      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2
          args: ./...
      - name: Go tests
        run: go test ./... -race
      - name: Go non-race large cardinality tests
        run: go test ./go/sketchkit/hllpp -run TestAccuracyLargeCardinality -count=1 -timeout=180s
      - name: Go vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
      - name: Repository leak guard
        run: >-
          ! git grep -nEi
          '(/[U]sers/|[g]ithub_pat_|[B]EGIN (RSA |EC |OPENSSH )?PRIVATE KEY|(^|[^[:alnum:]_])([g]ate(s)?|[r]oadmap|[p]rd|[p]rogress)([^[:alnum:]_]|$)|[o]telcol-genai-sketches)'
          -- .

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip==26.2 setuptools==83.0.0
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Python dependency vulnerability scan
        run: |
          python -m pip install pip-audit==2.10.1
          python -m pip_audit
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy --strict
      - name: Pytest
        run: pytest -q
      - name: Scorecard assets
        run: python scripts/render_scorecard.py --check

  proto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.5"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install grpc_tools protoc
        run: python -m pip install grpcio-tools==1.73.1 protobuf==6.33.5
      - name: Install protoc-gen-go
        run: go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.6
      - name: Regenerate protobufs and diff
        run: |
          export PATH="$(go env GOPATH)/bin:${PATH}"
          scripts/regenerate_protos.sh --check

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Build distributions
        run: |
          python -m pip install --upgrade pip==26.2 build==1.5.0 twine==6.2.0
          python -m build
          python -m twine check dist/*
          unzip -Z1 dist/*.whl | grep -qx 'llm_sketchkit/sketches_pb2.py'
          ! unzip -Z1 dist/*.whl | grep -q '^spec/'
      - name: Install wheel in a clean environment
        run: |
          python -m venv /tmp/llm-sketchkit-wheel
          wheel="$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          /tmp/llm-sketchkit-wheel/bin/pip install "$wheel"
          /tmp/llm-sketchkit-wheel/bin/python - <<'PY'
          import importlib.metadata
          import importlib.resources
          import llm_sketchkit

          assert importlib.metadata.version("llm-sketchkit") == "0.1.0a3"
          assert importlib.resources.files(llm_sketchkit).joinpath("py.typed").is_file()
          PY
