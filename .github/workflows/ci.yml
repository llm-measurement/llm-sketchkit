name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"
      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2
          args: ./...
      - name: Go tests
        run: go test ./... -race
      - name: Go non-race large cardinality tests
        run: go test ./go/sketchkit/hllpp -run TestAccuracyLargeCardinality -count=1 -timeout=180s
      - name: Go vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
      - name: Repository leak guard
        run: >-
          ! git grep -nEi
          '(/[U]sers/|[g]ithub_pat_|[B]EGIN (RSA |EC |OPENSSH )?PRIVATE KEY|(^|[^[:alnum:]_])([g]ate(s)?|[r]oadmap|[p]rd|[p]rogress)([^[:alnum:]_]|$))'
          -- .
      - name: SPDX header guard
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          while IFS= read -r file; do
            if ! head -n 10 "$file" | grep -Fqx '# SPDX-License-Identifier: Apache-2.0' &&
               ! head -n 10 "$file" | grep -Fqx '// SPDX-License-Identifier: Apache-2.0'; then
              missing+=("$file")
            fi
          done < <(git ls-files -- '*.go' '*.py' '*.proto' '*.sh' '*.yml' '*.yaml' '*.toml')
          if (( ${#missing[@]} )); then
            printf 'missing Apache-2.0 SPDX header: %s\n' "${missing[@]}" >&2
            exit 1
          fi

  go-supported:
    name: go-supported-${{ matrix.go-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.25.x"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go-version }}
      - name: Go tests
        run: go test ./...

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip==26.2.1 setuptools==83.0.0
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Python dependency vulnerability scan
        run: |
          python -m pip install pip-audit==2.10.1
          python -m pip_audit
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy --strict
      - name: Pytest
        run: pytest -q
      - name: Scorecard assets
        run: python scripts/render_scorecard.py --check

  python-supported:
    name: python-supported-${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: |
          python -m pip install --upgrade pip==26.2.1 setuptools==83.0.0
          python -m pip install -e '.[dev]'
      - name: Python tests
        run: pytest -q

  differential:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install package
        run: |
          python -m pip install --upgrade pip==26.2.1 setuptools==83.0.0
          python -m pip install -e .
      - name: Go and Python differential cases
        run: python scripts/differential_fuzz.py --seed 20260903 --cases 12 --max-updates 320

  notebook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install notebook dependencies
        run: |
          python -m pip install --upgrade pip==26.2.1 setuptools==83.0.0
          python -m pip install -e .
          python -m pip install \
            pandas==3.0.5 \
            matplotlib==3.11.1 \
            nbclient==0.11.0 \
            nbformat==5.11.1 \
            ipykernel==7.3.0 \
            pip-audit==2.10.1
          python -m pip_audit
      - name: Execute Go-to-Python notebook
        env:
          MPLCONFIGDIR: ${{ runner.temp }}/matplotlib
          JUPYTER_RUNTIME_DIR: ${{ runner.temp }}/jupyter
        run: |
          python - <<'PY'
          from pathlib import Path

          import nbformat
          from nbclient import NotebookClient

          root = Path.cwd()
          path = root / "examples" / "go-to-python" / "go-to-python.ipynb"
          notebook = nbformat.read(path, as_version=4)

          if any(cell.get("outputs") for cell in notebook.cells):
              raise RuntimeError("source notebook must not contain executed outputs")

          NotebookClient(
              notebook,
              timeout=180,
              kernel_name="python3",
              resources={"metadata": {"path": str(root)}},
          ).execute()

          images = sum(
              "image/png" in output.get("data", {})
              for cell in notebook.cells
              for output in cell.get("outputs", [])
          )
          if images != 2:
              raise RuntimeError(f"expected 2 rendered plots, found {images}")
          PY

  proto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install grpc_tools protoc
        run: python -m pip install grpcio-tools==1.73.1 protobuf==6.33.5
      - name: Install protoc-gen-go
        run: go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.6
      - name: Regenerate protobufs and diff
        run: |
          export PATH="$(go env GOPATH)/bin:${PATH}"
          scripts/regenerate_protos.sh --check

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Build distributions
        run: |
          python -m pip install --upgrade pip==26.2.1 build==1.6.0 twine==6.2.0
          python -m build
          python -m twine check dist/*
          unzip -Z1 dist/*.whl | grep -qx 'llm_sketchkit/sketches_pb2.py'
          ! unzip -Z1 dist/*.whl | grep -q '^spec/'
          tar -tzf dist/*.tar.gz | grep -q '/scripts/release_metadata.py$'
          tar -tzf dist/*.tar.gz | grep -q '/vectors/sketches/cross_language_hllpp_dense.json$'
          tar -tzf dist/*.tar.gz | grep -q '/vectors/compat/v0.1.0.json$'
      - name: Install wheel in a clean environment
        run: |
          python -m venv /tmp/llm-sketchkit-wheel
          wheel="$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          /tmp/llm-sketchkit-wheel/bin/pip install "$wheel"
          expected_version="$(python -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          EXPECTED_VERSION="${expected_version}" /tmp/llm-sketchkit-wheel/bin/python - <<'PY'
          import importlib.metadata
          import importlib.resources
          import os
          import llm_sketchkit

          assert importlib.metadata.version("llm-sketchkit") == os.environ["EXPECTED_VERSION"]
          assert importlib.resources.files(llm_sketchkit).joinpath("py.typed").is_file()
          PY
      - name: Install and test source distribution
        run: |
          sdist="$(find dist -maxdepth 1 -name '*.tar.gz' -print -quit)"
          mkdir -p /tmp/llm-sketchkit-sdist-source
          tar -xzf "${sdist}" -C /tmp/llm-sketchkit-sdist-source
          source_root="$(find /tmp/llm-sketchkit-sdist-source -mindepth 1 -maxdepth 1 -type d -print -quit)"

          python -m venv /tmp/llm-sketchkit-sdist
          /tmp/llm-sketchkit-sdist/bin/pip install --upgrade pip==26.2.1 setuptools==83.0.0
          /tmp/llm-sketchkit-sdist/bin/pip install "${sdist}[dev]"
          cd "${source_root}"
          /tmp/llm-sketchkit-sdist/bin/python -m pytest -q
