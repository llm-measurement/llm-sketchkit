name: linux-benchmarks

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmarks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.10"

      - name: Environment
        run: |
          set -o pipefail
          { uname -a; lscpu; go version; } | tee benchmark-environment.txt

      - name: Hash throughput
        run: |
          set -o pipefail
          GOMAXPROCS=1 go test ./bench/hash -run '^$' -bench='BenchmarkHMACSHA25664_(64B|1KB)$' -benchmem -count=5 | tee benchmark-hash.txt

      - name: Sketch update throughput
        run: |
          set -o pipefail
          GOMAXPROCS=1 go test ./bench/sketch -run '^$' -bench='Benchmark(HLLPPAddHash|FrequentItemsAddHash)_' -benchmem -count=5 | tee benchmark-sketch.txt

      - name: Upload raw results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-benchmarks-${{ github.sha }}
          path: benchmark-*.txt
          if-no-files-found: error
