name: release-distributions

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing v* tag whose package metadata should be validated
        required: true
        type: string
        default: v0.2.2
      publish_pypi:
        description: Publish with PyPI trusted publishing when the repository is public
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.tag.outputs.commit }}
      python_version: ${{ steps.release.outputs.python_version }}
    steps:
      - name: Check out workflow dependencies
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
      - name: Resolve existing release tag
        id: tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          case "$RELEASE_TAG" in
            v*) ;;
            *) echo "Release source must be an existing v* tag" >&2; exit 1 ;;
          esac
          git check-ref-format "refs/tags/${RELEASE_TAG}"
          git show-ref --verify --quiet "refs/tags/${RELEASE_TAG}"
          commit=$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")
          printf 'commit=%s\n' "$commit" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install locked build dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements/release.txt
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ steps.tag.outputs.commit }}
      - name: Verify release version
        id: release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: >-
          python scripts/release_metadata.py
          --tag "${RELEASE_TAG}"
          --github-output "${GITHUB_OUTPUT}"
      - name: Build and validate distributions
        run: |
          python -m build --no-isolation
          python -m twine check dist/*
          unzip -Z1 dist/*.whl | grep -qx 'llm_sketchkit/sketches_pb2.py'
          ! unzip -Z1 dist/*.whl | grep -q '^spec/'
          tar -tzf dist/*.tar.gz | grep -q '/scripts/release_metadata.py$'
          tar -tzf dist/*.tar.gz | grep -q '/vectors/sketches/cross_language_hllpp_dense.json$'
          tar -tzf dist/*.tar.gz | grep -q '/vectors/compat/v0.1.0.json$'
          tar -tzf dist/*.tar.gz | grep -q '/vectors/summaries/envelope.json$'
      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

  sbom:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.build.outputs.commit }}
      - name: Prepare SBOM directory
        run: mkdir -p sbom
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: spdx-json
          output-file: sbom/llm-sketchkit-${{ needs.build.outputs.python_version }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
          syft-version: v1.51.1
      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-sbom
          path: sbom/*.spdx.json
          if-no-files-found: error

  assemble-release-assets:
    needs: [build, sbom]
    runs-on: ubuntu-latest
    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-distributions
          path: release/
      - name: Download SBOM
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-sbom
          path: sbom/
      - name: Write release checksums
        run: |
          cp sbom/*.spdx.json release/
          cd release
          sha256sum *.whl *.tar.gz *.spdx.json > SHA256SUMS
      - name: Upload release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: release/
          if-no-files-found: error

  publish-pypi:
    needs: assemble-release-assets
    if: >-
      github.event.repository.visibility == 'public' &&
      (github.event_name == 'release' || inputs.publish_pypi)
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/llm-sketchkit
    permissions:
      actions: read
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-distributions
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  publish-github-assets:
    needs: assemble-release-assets
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: release/
      - name: Attach assets to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "${RELEASE_TAG}" release/* --repo "${GITHUB_REPOSITORY}"
