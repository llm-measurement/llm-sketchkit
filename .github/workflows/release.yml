name: release-distributions

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish_pypi:
        description: Publish with PyPI trusted publishing when the repository is public
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: python scripts/release_metadata.py --tag "${RELEASE_TAG}"
      - name: Build and validate distributions
        run: |
          python -m pip install --upgrade pip==26.2.1 build==1.5.0 twine==6.2.0
          python -m build
          python -m twine check dist/*
          unzip -Z1 dist/*.whl | grep -qx 'llm_sketchkit/sketches_pb2.py'
          ! unzip -Z1 dist/*.whl | grep -q '^spec/'
          tar -tzf dist/*.tar.gz | grep -q '/scripts/release_metadata.py$'
          tar -tzf dist/*.tar.gz | grep -q '/vectors/sketches/cross_language_hllpp_dense.json$'
      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

  publish-pypi:
    needs: build
    if: >-
      github.event.repository.visibility == 'public' &&
      (github.event_name == 'release' || inputs.publish_pypi)
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/llm-sketchkit
    permissions:
      actions: read
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-distributions
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
