[build-system]
requires = ["setuptools>=83"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-sketchkit"
version = "0.1.0a2"
description = "Deterministic Go and Python sketches for high-cardinality LLM data."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{name = "Vijay Erramilli"}, {name = "Codex"}]
dependencies = [
  "protobuf>=6.33.5,<7",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.10",
  "pytest>=8.0",
  "ruff>=0.5",
]
oracle = [
  "datasketches==5.2.0",
]

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]

[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = [".tools", ".venv", "python/spec/*_pb2.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["python", "tests"]
exclude = ["python/spec/.*_pb2\\.py"]
