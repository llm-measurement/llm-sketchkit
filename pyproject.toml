# SPDX-License-Identifier: Apache-2.0
[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-sketchkit"
version = "0.1.0a4"
description = "Deterministic Go and Python sketches for high-cardinality LLM data."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{name = "Vijay Erramilli"}, {name = "Codex"}]
keywords = ["sketches", "hyperloglog", "minhash", "bloom-filter", "streaming"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = [
  "protobuf>=6.33.5,<7",
]

[project.urls]
Documentation = "https://github.com/llm-measurement/llm-sketchkit#readme"
Issues = "https://github.com/llm-measurement/llm-sketchkit/issues"
Source = "https://github.com/llm-measurement/llm-sketchkit"

[project.optional-dependencies]
dev = [
  "mypy>=1.10",
  "pytest>=8.0",
  "ruff>=0.5",
]
oracle = [
  "datasketches==5.2.0",
]
release = [
  "build==1.5.0",
  "twine==6.2.0",
]

[tool.setuptools]
package-dir = {"" = "python"}
include-package-data = true

[tool.setuptools.package-data]
llm_sketchkit = ["py.typed"]

[tool.setuptools.packages.find]
where = ["python"]

[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = [".tools", ".venv", "python/llm_sketchkit/*_pb2.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["python", "tests"]
exclude = ["python/llm_sketchkit/.*_pb2\\.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
